services:
  postgres:
    image: 'postgres:latest'
    environment:
      - POSTGRES_DB=accounts_db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=yassineadmin
    volumes:
      - accounts_data:/var/lib/postgresql/data
    ports:
      - '5433:5432'
    networks:
      - accounts
  pgadmin4:
    image: dpage/pgadmin4
    restart: always
    ports:
      - "8088:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: test@gmail.com
      PGADMIN_DEFAULT_PASSWORD: test
    volumes:
      - accounts_pgadmin_data:/var/lib/pgadmin
    networks:
      - accounts
volumes:
  es-accounts_data:
  es-accounts_pgadmin_data:

networks:
  es-accounts-net:
    driver: bridge